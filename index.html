<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abinaya M - Portfolio</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #111; scroll-behavior: smooth; }
        ::selection { background-color: #111; color: #fff; }
        .border-tactile { border: 2px solid #111; box-shadow: 4px 4px 0px #111; transition: all 0.2s ease; }
        .border-tactile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #111; }
        .border-tactile:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #111; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f8f9fa; border-left: 1px solid #ddd; }
        ::-webkit-scrollbar-thumb { background: #111; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Github = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>;
        const Linkedin = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>;
        const Mail = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>;

        const Portfolio = () => {
            const skills = ['Python', 'Java', 'C', 'React.js', 'JavaScript', 'HTML/CSS', 'SQL', 'Docker', 'Pandas', 'NumPy', 'Machine Learning'];

            const experiences = [
                { title: 'UI/UX Designer Intern', company: 'Mita IT Automations', period: '07/2025 – 07/2025', desc: 'Designed with Adobe Photoshop, developed frontend using HTML, CSS, JavaScript, and Bootstrap.' },
                { title: 'Front End Developer Intern', company: 'MicroIT Solutions', period: '05/2025 – 06/2025', desc: 'Implemented supervised learning models and worked with Support Vector Machines (SVMs).' },
                { title: 'Data Science Intern', company: 'Prodigy Infotech', period: '08/2024 – 08/2024', desc: 'Developed predictive models and conducted exploratory data analysis on large datasets.' }
            ];

            const projects = [
                {
                    title: 'AI Grocery Assistant',
                    desc: 'An AI assistant for visually impaired users to shop independently using smartphone camera for item detection.',
                    tech: 'Python / ML / CV',
                    image: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=800'
                },
                {
                    title: 'Hotel Management',
                    desc: 'Java Swing application to streamline hotel operations including booking, billing, and staff management.',
                    tech: 'Java / Swing / Eclipse',
                    image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&q=80&w=800'
                },
                {
                    title: 'Restaurant System',
                    desc: 'Web-based application automating menu display, food ordering, and billing.',
                    tech: 'PHP / MySQL / HTML',
                    image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&q=80&w=800'
                }
            ];

            return (
                <div className="min-h-screen bg-[#f8f9fa] text-[#111]">
                    
                    {/* Navigation */}
                    <nav className="fixed top-0 w-full bg-[#f8f9fa]/90 backdrop-blur-md z-50 border-b-2 border-black">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <a href="#" className="font-black text-2xl tracking-tighter uppercase">Abinaya M.</a>
                            <div className="hidden md:flex gap-8 items-center font-bold text-sm tracking-widest uppercase">
                                <a href="#work" className="hover:line-through decoration-2">Work</a>
                                <a href="#about" className="hover:line-through decoration-2">About</a>
                                <a href="#experience" className="hover:line-through decoration-2">Experience</a>
                                <a href="#contact" className="hover:line-through decoration-2">Contact</a>
                                <a href="resume.pdf" target="_blank" rel="noopener noreferrer" className="ml-4 px-4 py-2 border-2 border-black bg-white hover:bg-black hover:text-white transition-colors border-tactile flex items-center gap-2">
                                    Resume
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                </a>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="pt-40 pb-20 px-6 max-w-7xl mx-auto min-h-[80vh] flex flex-col justify-center">
                        <h1 className="text-6xl md:text-8xl lg:text-[10rem] font-black leading-[0.9] tracking-tighter mb-8 uppercase">
                            Abinaya<br/>
                            <span className="text-transparent" style={{ WebkitTextStroke: '2px #111' }}>Mahendran.</span>
                        </h1>
                        <div className="max-w-2xl border-l-4 border-black pl-6 py-2">
                            <p className="text-2xl md:text-3xl font-semibold mb-4">
                                Creative Developer, UI/UX Designer & Data Science Enthusiast.
                            </p>
                            <p className="text-lg text-gray-600 font-medium">
                                Crafting beautiful and intuitive experiences with purpose. Pushing the boundaries of creative interface design while maintaining clear usability.
                            </p>
                        </div>
                        <div className="mt-16 flex flex-wrap gap-4">
                            <a href="#work" className="px-8 py-4 bg-black text-white font-bold uppercase tracking-widest text-sm hover:bg-gray-800 transition-colors border-tactile">
                                View Projects
                            </a>
                            <a href="#contact" className="px-8 py-4 bg-white text-black font-bold uppercase tracking-widest text-sm border-tactile">
                                Contact Me
                            </a>
                            <a href="resume.pdf" target="_blank" rel="noopener noreferrer" className="px-8 py-4 bg-[#f8f9fa] text-black font-bold uppercase tracking-widest text-sm border-tactile flex items-center gap-2 hover:bg-white transition-colors">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                View Resume
                            </a>
                        </div>
                    </header>

                    <div className="border-t-2 border-black w-full my-12"></div>

                    {/* Selected Work */}
                    <section id="work" className="py-20 px-6 max-w-7xl mx-auto">
                        <div className="flex justify-between items-end mb-16">
                            <h2 className="text-5xl md:text-7xl font-black tracking-tighter uppercase">Selected Work</h2>
                            <span className="font-bold text-xl">( 2024 — 2026 )</span>
                        </div>
                        
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-12">
                            {projects.map((project, idx) => (
                                <div key={idx} className={`group`}>
                                    <div className="overflow-hidden border-2 border-black bg-white p-2 mb-6 border-tactile">
                                        <img 
                                            src={project.image} 
                                            alt={project.title} 
                                            className="w-full h-[250px] object-cover grayscale group-hover:grayscale-0 transition-all duration-500"
                                        />
                                    </div>
                                    <div className="flex justify-between items-start border-b-2 border-black pb-4">
                                        <div>
                                            <h3 className="text-3xl font-black uppercase tracking-tight mb-2 group-hover:underline decoration-4 underline-offset-4">{project.title}</h3>
                                            <p className="text-gray-600 font-medium max-w-md">{project.desc}</p>
                                        </div>
                                        <span className="text-xs font-bold uppercase tracking-widest bg-black text-white px-3 py-1 mt-2">{project.tech}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Experience & About */}
                    <section id="about" className="py-20 bg-black text-white border-y-2 border-black">
                        <div className="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-20">
                            
                            <div>
                                <h2 className="text-5xl font-black tracking-tighter uppercase mb-12">About Me</h2>
                                <p className="text-xl leading-relaxed font-medium mb-8 text-gray-300">
                                    My mission as a designer and developer is to combine creative mechanics, aesthetics, and a whole lot of polish — all in the name of crafting experiences that spark joy.
                                </p>
                                <p className="text-xl leading-relaxed font-medium mb-12 text-gray-300">
                                    Currently pursuing B.E. Computer Science Engineering at M Kumarasamy College of Engineering (Expected 2027, CGPA: 9).
                                </p>
                                
                                <h3 className="text-2xl font-bold uppercase mb-6 border-b-2 border-gray-800 pb-2">Toolkit</h3>
                                <div className="flex flex-wrap gap-3">
                                    {skills.map(skill => (
                                        <span key={skill} className="px-4 py-2 border-2 border-gray-700 rounded-full text-sm font-bold tracking-wider hover:bg-white hover:text-black hover:border-white transition-colors cursor-default">
                                            {skill}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div id="experience">
                                <h2 className="text-5xl font-black tracking-tighter uppercase mb-12">Experience</h2>
                                <div className="space-y-8">
                                    {experiences.map((exp, idx) => (
                                        <div key={idx} className="border-l-4 border-white pl-6 hover:border-gray-500 transition-colors">
                                            <div className="flex flex-wrap justify-between items-baseline mb-2">
                                                <h3 className="text-2xl font-bold">{exp.title}</h3>
                                                <span className="text-gray-400 font-mono text-sm">{exp.period}</span>
                                            </div>
                                            <h4 className="text-xl text-gray-300 mb-3">{exp.company}</h4>
                                            <p className="text-gray-400">{exp.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* Certifications Section */}
                    <section className="py-20 px-6 max-w-7xl mx-auto border-b-2 border-black">
                        <div className="mb-16">
                            <h2 className="text-5xl md:text-7xl font-black tracking-tighter uppercase mb-6">Global<br/>Certifications</h2>
                            <p className="text-xl text-gray-600 font-medium">
                                Validating my skills across global industry standards.
                            </p>
                        </div>
                        
                        {/* Global Certifications (Massive View) */}
                        <div className="space-y-24 mt-12 mb-24">
                            {[
                                {
                                    title: 'Azure AI Fundamentals',
                                    issuer: 'Microsoft Certified',
                                    date: 'April 2026',
                                    desc: 'Demonstrated foundational knowledge of machine learning and artificial intelligence concepts.',
                                    image: 'azure_ai.jpg',
                                    fallbackText: 'Azure AI Fundamentals'
                                },
                                {
                                    title: 'Getting started with AI',
                                    issuer: 'IBM',
                                    date: '2024',
                                    desc: 'Foundational concepts of Artificial Intelligence, cognitive computing, and its industry applications.',
                                    image: 'ibm_ai.jpg',
                                    fallbackText: 'IBM AI Certificate'
                                }
                            ].map((cert, idx) => (
                                <div key={idx} className="grid md:grid-cols-2 gap-12 items-center">
                                    <div className={idx % 2 !== 0 ? 'md:order-2' : ''}>
                                        <div className="p-8 border-2 border-black bg-white inline-block border-tactile hover:-translate-y-1 transition-transform w-full">
                                            <h3 className="text-2xl font-black uppercase mb-1">{cert.issuer}</h3>
                                            <p className="text-xl font-bold text-blue-600 mb-4">{cert.title}</p>
                                            <p className="text-gray-600 font-medium mb-6">
                                                {cert.desc}
                                            </p>
                                            <div className="flex items-center gap-4 text-sm font-bold text-gray-500 uppercase tracking-widest pt-4 border-t-2 border-gray-100">
                                                <span>Issued: {cert.date}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className={`relative p-4 border-2 border-black bg-white border-tactile transform ${idx % 2 === 0 ? 'rotate-2 hover:rotate-0' : '-rotate-1 hover:rotate-0'} transition-transform ${idx % 2 !== 0 ? 'md:order-1' : ''}`}>
                                        <div className="absolute -inset-4 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIj48L3JlY3Q+CjxjaXJjbGUgY3g9IjEiIGN5PSIxIiByPSIxIiBmaWxsPSIjMDAwIj48L2NpcmNsZT4KPC9zdmc+')] opacity-20 -z-10"></div>
                                        <img src={cert.image} alt={cert.title} className="w-full h-auto grayscale hover:grayscale-0 transition-all duration-500" onError={(e) => { e.target.src = `https://via.placeholder.com/600x400/000000/ffffff?text=${cert.fallbackText.replace(/ /g, '+')}` }} />
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Specializations & Courses (Grid View) */}
                        <div className="mb-12">
                            <h3 className="text-3xl font-black tracking-tighter uppercase mb-4 border-b-4 border-black pb-2 inline-block">Specializations & Courses</h3>
                        </div>
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {[
                                {
                                    title: 'Career Essential in Software Dev',
                                    issuer: 'LinkedIn & Microsoft',
                                    date: '2024',
                                    image: 'images/software_dev.jpg',
                                    fallbackText: 'Software Development'
                                },
                                {
                                    title: 'Intro to Artificial Intelligence',
                                    issuer: 'Course Specialization',
                                    date: 'Recent',
                                    image: 'images/AI.jpg',
                                    fallbackText: 'Intro to AI'
                                },
                                {
                                    title: 'Large Language Model Basics',
                                    issuer: 'Course Specialization',
                                    date: 'Recent',
                                    image: 'images/LLM.jpg',
                                    fallbackText: 'LLM Basics'
                                },
                                {
                                    title: 'Mastering the Art of Prompting',
                                    issuer: 'Course Specialization',
                                    date: 'Recent',
                                    image: 'images/PROMPT.jpg',
                                    fallbackText: 'Prompting Certificate'
                                }
                            ].map((cert, idx) => (
                                <div key={idx} className="flex flex-col h-full border-2 border-black bg-white border-tactile hover:-translate-y-2 transition-transform">
                                    <div className="relative p-2 border-b-2 border-black">
                                        <img src={cert.image} alt={cert.title} className="w-full h-32 object-cover grayscale hover:grayscale-0 transition-all duration-500" onError={(e) => { e.target.src = `https://via.placeholder.com/600x400/000000/ffffff?text=${cert.fallbackText.replace(/ /g, '+')}` }} />
                                    </div>
                                    <div className="p-4 flex flex-col flex-grow">
                                        <h3 className="text-[10px] font-black uppercase mb-1 text-gray-500 tracking-widest">{cert.issuer}</h3>
                                        <p className="text-sm font-bold text-black mb-2 leading-tight">{cert.title}</p>
                                        <div className="mt-auto pt-2 border-t-2 border-gray-100 text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                                            Issued: {cert.date}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Volunteering & Leadership */}
                    <section className="py-20 bg-black text-white border-y-2 border-black">
                        <div className="max-w-7xl mx-auto px-6">
                            <h2 className="text-5xl md:text-7xl font-black tracking-tighter uppercase mb-16 text-center">Volunteering<br/>& Leadership</h2>
                            <div className="grid md:grid-cols-2 gap-12">
                                <div className="p-8 border-4 border-white bg-black hover:bg-white hover:text-black transition-colors cursor-default group">
                                    <div className="flex justify-between items-start mb-6">
                                        <h3 className="text-3xl font-black uppercase">Campus Ambassador</h3>
                                        <span className="font-bold font-mono text-sm">08/2025</span>
                                    </div>
                                    <h4 className="text-xl font-bold mb-4 text-gray-400 group-hover:text-gray-600">Unstop</h4>
                                    <p className="text-lg font-medium text-gray-300 group-hover:text-black">Promoted Unstop events on campus, encouraged student engagement, and represented the brand among peers.</p>
                                </div>
                                <div className="p-8 border-4 border-white bg-black hover:bg-white hover:text-black transition-colors cursor-default group">
                                    <div className="flex justify-between items-start mb-6">
                                        <h3 className="text-3xl font-black uppercase">Vice President</h3>
                                        <span className="font-bold font-mono text-sm">09/2025</span>
                                    </div>
                                    <h4 className="text-xl font-bold mb-4 text-gray-400 group-hover:text-gray-600">IEEE Student Club</h4>
                                    <p className="text-lg font-medium text-gray-300 group-hover:text-black">Enhanced collaboration and creativity among team members, resulting in a well-recognized presentation at the event.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer / Contact */}
                    <footer id="contact" className="py-32 px-6 max-w-7xl mx-auto text-center">
                        <h2 className="text-6xl md:text-8xl font-black tracking-tighter uppercase mb-12 hover:scale-105 transition-transform cursor-pointer">
                            <a href="mailto:abinayamahendran2006@gmail.com">Let's Talk.</a>
                        </h2>
                        
                        <div className="flex justify-center gap-8 mb-16">
                            <a href="https://github.com/abinaya-mahendran123" target="_blank" className="p-4 border-2 border-black rounded-full hover:bg-black hover:text-white transition-colors border-tactile">
                                <Github />
                            </a>
                            <a href="https://www.linkedin.com/in/abinaya-mahendran-8282ab308/" target="_blank" className="p-4 border-2 border-black rounded-full hover:bg-black hover:text-white transition-colors border-tactile">
                                <Linkedin />
                            </a>
                            <a href="mailto:abinayamahendran2006@gmail.com" className="p-4 border-2 border-black rounded-full hover:bg-black hover:text-white transition-colors border-tactile">
                                <Mail />
                            </a>
                        </div>
                        
                        <div className="font-bold uppercase tracking-widest text-sm text-gray-500">
                            © 2026 Abinaya M. — Designed with purpose.
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<Portfolio />, document.getElementById('root'));
    </script>
</body>
</html>
